services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ghn_meeting_room_booking
      POSTGRES_USER: ghn_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghn_app -d ghn_meeting_room_booking"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ghn_meeting_room_booking
      DB_USER: ghn_app
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      ALLOWED_ORIGINS: https://datphonghop.ghn.vn
      SSO_ENABLED: "true"
      SSO_BASE_URL: https://online-gateway.ghn.vn/sso-v2
      SSO_CLIENT_ID: ${SSO_CLIENT_ID}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET}
      SSO_REDIRECT_URI: https://datphonghop-api.ghn.vn/api/auth/sso/callback
      SSO_FRONTEND_URL: https://datphonghop.ghn.vn
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
