<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Icon Đặt phòng họp">
  <defs>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#2A251E" flood-opacity="0.18"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="28" y="34" width="72" height="64" rx="10"/>
    </clipPath>
  </defs>

  <!-- binder rings -->
  <rect x="42" y="27" width="7" height="15" rx="3.5" fill="#FFFFFF" stroke="#171310" stroke-width="2.6" stroke-linejoin="round"/>
  <rect x="79" y="27" width="7" height="15" rx="3.5" fill="#FFFFFF" stroke="#171310" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- calendar card -->
  <g filter="url(#cardShadow)">
    <g clip-path="url(#cardClip)">
      <rect x="28" y="34" width="72" height="64" fill="#FFFFFF"/>
      <rect x="28" y="34" width="72" height="19" fill="#FF6C0A"/>
      <path d="M28 53 H100" stroke="#171310" stroke-width="2.6"/>

      <!-- day grid: 3 cols x 2 rows -->
      <rect x="36" y="61" width="14" height="14" rx="4" fill="#EFE7D6" stroke="#171310" stroke-width="2.2" stroke-linejoin="round"/>
      <rect x="57" y="61" width="14" height="14" rx="4" fill="#EFE7D6" stroke="#171310" stroke-width="2.2" stroke-linejoin="round"/>
      <rect x="78" y="61" width="14" height="14" rx="4" fill="#EFE7D6" stroke="#171310" stroke-width="2.2" stroke-linejoin="round"/>
      <rect x="36" y="79" width="14" height="14" rx="4" fill="#EFE7D6" stroke="#171310" stroke-width="2.2" stroke-linejoin="round"/>
      <rect x="78" y="79" width="14" height="14" rx="4" fill="#EFE7D6" stroke="#171310" stroke-width="2.2" stroke-linejoin="round"/>

      <!-- booked slot, highlighted -->
      <rect x="57" y="79" width="14" height="14" rx="4" fill="#FF6C0A" stroke="#171310" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M60.4 86.2 L63 88.8 L67.6 82.8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="28" y="34" width="72" height="64" rx="10" fill="none" stroke="#171310" stroke-width="2.8"/>
  </g>
</svg>
